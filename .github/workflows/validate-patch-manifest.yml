name: Validate Patch Manifest

on:
  push:
      paths:
            - 'source/patches/**'
              pull_request:
                  paths:
                        - 'source/patches/**'
                          workflow_dispatch:

                          jobs:
                            validate:
                                runs-on: ubuntu-latest
                                    name: Validate patch-manifest.json
                                        steps:
                                              - name: Checkout repository
                                                      uses: actions/checkout@v4

                                                            - name: Validate patch manifest
                                                                    run: |
                                                                              python3 - <<'EOF'
                                                                                        import json, os, sys

                                                                                                  manifest_path = "source/patches/patch-manifest.json"
                                                                                                            patches_dir = "source/patches"
                                                                                                            
                                                                                                                      if not os.path.exists(manifest_path):
                                                                                                                                  print(f"ERROR: {manifest_path} not found")
                                                                                                                                              sys.exit(1)
                                                                                                                                              
                                                                                                                                                        with open(manifest_path) as f:
                                                                                                                                                                    manifest = json.load(f)
                                                                                                                                                                    
                                                                                                                                                                              # Get all patch files on disk
                                                                                                                                                                                        disk_patches = set(
                                                                                                                                                                                                    f for f in os.listdir(patches_dir)
                                                                                                                                                                                                                if f.endswith(".patch")
                                                                                                                                                                                                                          )
                                                                                                                                                                                                                          
                                                                                                                                                                                                                                    # Get all patch files listed in the manifest
                                                                                                                                                                                                                                              if isinstance(manifest, list):
                                                                                                                                                                                                                                                          manifest_patches = set(entry.get("file", entry) if isinstance(entry, dict) else entry for entry in manifest)
                                                                                                                                                                                                                                                                    elif isinstance(manifest, dict):
                                                                                                                                                                                                                                                                                manifest_patches = set(manifest.get("patches", manifest.keys()))
                                                                                                                                                                                                                                                                                          else:
                                                                                                                                                                                                                                                                                                      print("ERROR: Unexpected manifest format")
                                                                                                                                                                                                                                                                                                                  sys.exit(1)
                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                            # Normalize to just filenames
                                                                                                                                                                                                                                                                                                                                      manifest_patches = set(os.path.basename(p) for p in manifest_patches)
                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                missing_from_disk = manifest_patches - disk_patches
                                                                                                                                                                                                                                                                                                                                                          orphaned_on_disk = disk_patches - manifest_patches
                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                    failed = False
                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                              if missing_from_disk:
                                                                                                                                                                                                                                                                                                                                                                                          print("MISSING from disk (listed in manifest but no file):")
                                                                                                                                                                                                                                                                                                                                                                                                      for f in sorted(missing_from_disk):
                                                                                                                                                                                                                                                                                                                                                                                                                    print(f"  - {f}")
                                                                                                                                                                                                                                                                                                                                                                                                                                failed = True
                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                          if orphaned_on_disk:
                                                                                                                                                                                                                                                                                                                                                                                                                                                      print("ORPHANED on disk (file exists but not in manifest):")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  for f in sorted(orphaned_on_disk):
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                print(f"  - {f}")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            failed = True
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if not failed:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  print(f"OK: All {len(manifest_patches)} patches accounted for.")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sys.exit(1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  EOF
