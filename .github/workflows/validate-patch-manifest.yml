name: Validate Patch Manifest

on:
  push:
    paths:
      - "source/patches/**"
      - ".github/workflows/validate-patch-manifest.yml"
  pull_request:
    paths:
      - "source/patches/**"
      - ".github/workflows/validate-patch-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate patch-manifest.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate patch manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          manifest_path = pathlib.Path("source/patches/patch-manifest.json")
          patches_dir = manifest_path.parent

          if not manifest_path.exists():
              print(f"ERROR: {manifest_path} not found")
              sys.exit(1)

          with manifest_path.open(encoding="utf-8-sig") as handle:
              manifest = json.load(handle)

          if not isinstance(manifest, dict):
              print("ERROR: patch manifest must be a JSON object")
              sys.exit(1)

          patch_files = manifest.get("patchFiles")
          if not isinstance(patch_files, list):
              print("ERROR: patch manifest must contain a patchFiles list")
              sys.exit(1)

          manifest_patches = {
              os.path.basename(item)
              for item in patch_files
              if isinstance(item, str) and item.endswith(".patch")
          }
          disk_patches = {
              path.name
              for path in patches_dir.iterdir()
              if path.is_file() and path.suffix == ".patch"
          }

          malformed = [
              item for item in patch_files
              if not isinstance(item, str) or not item.endswith(".patch")
          ]
          missing_from_disk = manifest_patches - disk_patches
          orphaned_on_disk = disk_patches - manifest_patches

          failed = False

          if malformed:
              print("MALFORMED patchFiles entries:")
              for item in malformed:
                  print(f"  - {item!r}")
              failed = True

          if missing_from_disk:
              print("MISSING from disk (listed in manifest but no file):")
              for name in sorted(missing_from_disk):
                  print(f"  - {name}")
              failed = True

          if orphaned_on_disk:
              print("ORPHANED on disk (file exists but is not listed):")
              for name in sorted(orphaned_on_disk):
                  print(f"  - {name}")
              failed = True

          if failed:
              sys.exit(1)

          print(f"OK: all {len(manifest_patches)} patch files are accounted for.")
          PY
